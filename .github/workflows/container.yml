name: container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the frozen Python 3.12 container
        run: docker build --tag spatial-support-audit:test .
      - name: Run container validation
        run: docker run --rm spatial-support-audit:test
      - name: Check the complete pipeline entry point
        run: >-
          docker run --rm spatial-support-audit:test
          python run_pipeline.py run --dry-run
